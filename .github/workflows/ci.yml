name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Canonical harness
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI check
        run: pnpm ci:check

      - name: Electron smoke
        run: pnpm --filter @exograph/desktop exec playwright test tests/e2e/gate-d-gpu-terminal-smoke.spec.ts

      - name: Browser workspace smoke
        run: |
          pnpm exec playwright install chromium
          pnpm --filter @exograph/desktop exec playwright test tests/e2e/browser-workspace.spec.ts tests/e2e/list-layout.spec.ts

      - name: Upload Electron failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-smoke-failure-${{ github.run_id }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
